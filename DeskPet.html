<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Desktop Pet Slideshow</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
    height: 100%;
    width: 100%;
  }
  #slideshow {
    position: relative;
    height: 100%;
    width: 100%;
    background: black;
  }
  canvas {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    /* Ensure smooth scaling */
    image-rendering: auto;
  }
</style>
</head>
<body>
<div id="slideshow">
  <canvas id="canvas1"></canvas>
  <canvas id="canvas2"></canvas>
</div>

<script>
(async function() {
  const DEFAULT_DURATION = 5; // seconds
  const DEFAULT_FADE = 300;   // milliseconds
  const DEFAULT_WIDTH = 954;  // nominal portrait width
  const DEFAULT_HEIGHT = 1552; // nominal portrait height
  const JSON_FILE = 'flickr_photos.json';

  const params = Object.fromEntries(new URLSearchParams(window.location.search));

  const duration = params.duration ? parseFloat(params.duration) : DEFAULT_DURATION;
  const fade = params.fade ? parseInt(params.fade) : DEFAULT_FADE;
  const imgWidth = params.imgwidth ? parseInt(params.imgwidth) : DEFAULT_WIDTH;
  const imgHeight = params.imgheight ? parseInt(params.imgheight) : DEFAULT_HEIGHT;

  const orientTags = params.orient ? params.orient.split(',').map(s=>s.trim().toLowerCase()).map(o=>'orient'+o.replace(/[\s-]/g,'')) : [];
  const outfitTags = params.outfit ? params.outfit.split(',').map(s=>s.trim().toLowerCase()).map(o=>'outfit'+o.replace(/[\s-]/g,'')) : [];
  const peopleTags = params.people ? params.people.split(',').map(s=>s.trim().toLowerCase()).map(p=>'person'+p.replace(/[\s-]/g,'')) : [];

  // Load JSON
  let data;
  try {
    const resp = await fetch(JSON_FILE);
    data = await resp.json();
  } catch (e) {
    alert("Error loading JSON: "+e);
    return;
  }

  // Filter images
  const filtered = data.filter(photo=>{
    const photoTags = photo.tags.map(t=>t.toLowerCase().replace(/[\s-]/g,''));
    if (orientTags.length && !orientTags.some(tag=>photoTags.includes(tag))) return false;
    if (outfitTags.length && !outfitTags.some(tag=>photoTags.includes(tag))) return false;
    if (peopleTags.length && !photoTags.some(tag=>peopleTags.includes(tag))) return false;
    return true;
  });

  if (!filtered.length) {
    alert("No images match filters.");
    return;
  }

  // Shuffle with no same person back-to-back
  function shufflePlaylist(images, people) {
    const arr = [...images];
    for (let i=arr.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    if(people.length>1){
      for(let i=1;i<arr.length;i++){
        const prev = arr[i-1].tags.find(t=>t.startsWith('person'));
        const curr = arr[i].tags.find(t=>t.startsWith('person'));
        if(prev && curr && prev===curr){
          for(let j=i+1;j<arr.length;j++){
            const swap = arr[j].tags.find(t=>t.startsWith('person'));
            if(swap && swap!==prev){ [arr[i],arr[j]]=[arr[j],arr[i]]; break; }
          }
        }
      }
    }
    return arr;
  }

  const playlist = shufflePlaylist(filtered, peopleTags);

  const canvases = [document.getElementById('canvas1'), document.getElementById('canvas2')];
  canvases.forEach(c=>{
    c.width = imgWidth;
    c.height = imgHeight;
    c.style.width = imgWidth+'px';
    c.style.height = imgHeight+'px';
  });

  let active = 0;
  let currentIndex = 0;

  function preload(src) {
    const img = new Image();
    img.src = src;
    return img;
  }

  async function drawImageOnCanvas(img, canvas, opacity=1) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.globalAlpha = opacity;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    const scale = Math.min(canvas.width/img.width, canvas.height/img.height);
    const w = img.width*scale;
    const h = img.height*scale;
    const x = (canvas.width-w)/2;
    const y = (canvas.height-h)/2;
    ctx.drawImage(img,x,y,w,h);
    ctx.globalAlpha = 1; // reset
  }

  async function crossfade(nextIndex) {
    const nextCanvas = canvases[1-active];
    const currCanvas = canvases[active];
    const nextImg = preload(playlist[nextIndex].url);

    await nextImg.decode(); // ensure loaded

    const steps = Math.ceil(fade/16); // ~60fps
    let step = 0;

    function animate() {
      step++;
      const opacity = step/steps;
      drawImageOnCanvas(nextImg, nextCanvas, opacity);
      drawImageOnCanvas(preload(playlist[currentIndex].url), currCanvas, 1-opacity);
      if(step<steps) requestAnimationFrame(animate);
      else {
        active = 1-active;
        currentIndex = nextIndex;
      }
    }
    animate();

    // Preload the one after next
    const preloadIndex = (currentIndex+1)%playlist.length;
    preload(playlist[preloadIndex].url);
  }

  // Initialize first image
  const firstImg = preload(playlist[0].url);
  await firstImg.decode();
  await drawImageOnCanvas(firstImg, canvases[active]);

  // Preload second
  if(playlist.length>1) preload(playlist[1].url);

  // Slideshow loop
  setInterval(()=>{
    const nextIndex = (currentIndex+1)%playlist.length;
    crossfade(nextIndex);
  }, duration*1000);

})();
</script>
</body>
</html>
