<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Desktop Pet Slideshow</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
    height: 100%;
    width: 100%;
  }
  #slideshow {
    position: relative;
    height: 100%;
    width: 100%;
  }
  #slideshow img {
    position: absolute;
    top: 50%;
    left: 50%;
    max-height: 100%;
    width: auto;
    transform: translate(-50%, -50%);
    opacity: 0;
  }
  #slideshow img.active {
    opacity: 1;
  }
</style>
</head>
<body>
<div id="slideshow">
  <img id="img1" />
  <img id="img2" />
</div>
<script>
(async function() {
  const DEFAULT_DURATION = 5; // seconds
  const DEFAULT_FADE = 300;   // milliseconds
  const JSON_FILE = 'flickr_photos.json';

  function getQueryParams() {
    const params = {};
    window.location.search.substring(1).split("&").forEach(pair => {
      let [key, value] = pair.split("=");
      if (value) {
        params[key.toLowerCase()] = decodeURIComponent(value);
      }
    });
    return params;
  }

  function normalizeTag(tag) {
    return tag.toLowerCase().replace(/[\s-]/g,'');
  }

  function parseListParam(param) {
    return param.split(",").map(v => v.trim().toLowerCase());
  }

  function shufflePlaylist(images, peopleList) {
    const shuffled = [...images];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    if (peopleList.length > 1) {
      for (let i = 1; i < shuffled.length; i++) {
        const prevPerson = shuffled[i-1].tags.find(t => t.startsWith("person"));
        const currPerson = shuffled[i].tags.find(t => t.startsWith("person"));
        if (prevPerson && currPerson && prevPerson === currPerson) {
          for (let j = i+1; j < shuffled.length; j++) {
            const swapPerson = shuffled[j].tags.find(t => t.startsWith("person"));
            if (swapPerson && swapPerson !== prevPerson) {
              [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
              break;
            }
          }
        }
      }
    }
    return shuffled;
  }

  // Load JSON
  let data;
  try {
    const resp = await fetch(JSON_FILE);
    data = await resp.json();
  } catch (e) {
    alert("Error loading JSON file: " + e);
    return;
  }

  const params = getQueryParams();
  if (!params.orient && !params.outfit && !params.people) {
    alert("At least one of orient, outfit, or people parameters must be specified.");
    return;
  }

  const duration = params.duration ? parseFloat(params.duration) : DEFAULT_DURATION;
  const fade = params.fade ? parseInt(params.fade) : DEFAULT_FADE;

  const orientTags = params.orient ? parseListParam(params.orient).map(o => 'orient'+normalizeTag(o)) : [];
  const outfitTags = params.outfit ? parseListParam(params.outfit).map(o => 'outfit'+normalizeTag(o)) : [];
  const peopleTags = params.people ? parseListParam(params.people).map(p => 'person'+normalizeTag(p)) : [];

  const filtered = data.filter(photo => {
    const photoTags = photo.tags.map(normalizeTag);
    if (orientTags.some(tag => !photoTags.includes(tag))) return false;
    if (outfitTags.some(tag => !photoTags.includes(tag))) return false;
    if (peopleTags.length && !photoTags.some(tag => peopleTags.includes(tag))) return false;
    return true;
  });

  if (!filtered.length) {
    alert("No images match the specified filters.");
    return;
  }

  const playlist = shufflePlaylist(filtered, peopleTags);

  let currentIndex = 0;
  const imgEls = [document.getElementById("img1"), document.getElementById("img2")];
  let active = 0;

  function preload(src) {
    const img = new Image();
    img.src = src;
  }

  function crossfade(nextIndex) {
    const nextImg = imgEls[1-active];
    const currImg = imgEls[active];
    nextImg.src = playlist[nextIndex].url;
    nextImg.style.transition = `opacity ${fade}ms ease`;
    nextImg.style.opacity = 0;
    nextImg.classList.add('active');

    // Force reflow to apply transition
    void nextImg.offsetWidth;

    nextImg.style.opacity = 1;
    currImg.style.transition = `opacity ${fade}ms ease`;
    currImg.style.opacity = 0;

    setTimeout(() => {
      currImg.classList.remove('active');
      active = 1 - active;
      currentIndex = nextIndex;

      // Preload the one after next
      const preloadIndex = (currentIndex + 1) % playlist.length;
      preload(playlist[preloadIndex].url);
    }, fade);
  }

  // Initialize first image
  imgEls[active].src = playlist[currentIndex].url;
  imgEls[active].style.opacity = 1;
  imgEls[active].classList.add('active');
  if (playlist.length > 1) preload(playlist[(currentIndex+1)%playlist.length].url);

  // Slideshow loop
  setInterval(() => {
    const nextIndex = (currentIndex + 1) % playlist.length;
    crossfade(nextIndex);
  }, duration*1000);

})();
</script>
</body>
</html>
