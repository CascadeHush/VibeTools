<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Divider</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #111;
      color: #fff;
    }
    form {
      text-align: center;
    }
    input {
      padding: 10px;
      font-size: 16px;
      width: 250px;
    }
    button {
      padding: 10px 15px;
      font-size: 16px;
      margin-left: 10px;
    }
    .title-display {
      font-size: 24px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

<div id="app"></div>

<script>
  const params = new URLSearchParams(window.location.search);
  const title = params.get("title");

  const app = document.getElementById("app");

  if (title) {
    // Set tab title
    document.title = title;

    // Show it visually too (optional)
    app.innerHTML = `<div class="title-display">${title}</div>`;
  } else {
    // Show input form
    app.innerHTML = `
      <form id="titleForm">
        <input type="text" id="titleInput" placeholder="Enter tab title" required />
        <button type="submit">Set</button>
      </form>
    `;

    document.getElementById("titleForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const value = document.getElementById("titleInput").value;

      // Encode for URL safety
      const encoded = encodeURIComponent(value);

      // Reload page with parameter
      window.location.search = "?title=" + encoded;
    });
  }
</script>

</body>
</html>
