<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Divider</title>

<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --accent: #4ade80;
    --text: #e5e7eb;
    --muted: #9ca3af;
  }

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
  }

  .card {
    background: var(--card);
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    width: 340px;
  }

  h1 {
    font-size: 18px;
    margin: 0 0 20px;
    color: var(--muted);
    font-weight: 500;
  }

  input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    outline: none;
    margin-bottom: 15px;
    font-size: 16px;
    background: #0b0d12;
    color: var(--text);
  }

  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 8px;
    margin-bottom: 15px;
  }

  .emoji {
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    text-align: center;
    transition: 0.15s;
  }

  .emoji:hover {
    background: #2a2f3a;
  }

  .emoji.selected {
    background: var(--accent);
    color: black;
  }

  button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: black;
    font-weight: 600;
    cursor: pointer;
  }

  .preview {
    margin-top: 20px;
    text-align: center;
    opacity: 0.8;
  }

  .preview span {
    font-size: 28px;
    display: block;
  }
</style>
</head>

<body>

<div class="card" id="app"></div>

<script>
const params = new URLSearchParams(location.search);
const titleParam = params.get("title");
const iconParam = params.get("icon");

const emojis = ["📁","📂","🗂️","📌","⭐","🔥","💡","🚧","🧠","⚡","📊","📝","🔖","🎯","🚀","📎"];

function setFavicon(emoji) {
  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <text y="0.9em" font-size="90">${emoji}</text>
    </svg>
  `;
  const url = "data:image/svg+xml," + encodeURIComponent(svg);

  let link = document.querySelector("link[rel~='icon']");
  if (!link) {
    link = document.createElement("link");
    link.rel = "icon";
    document.head.appendChild(link);
  }
  link.href = url;
}

const app = document.getElementById("app");

if (titleParam) {
  const emoji = iconParam || "📁";

  document.title = titleParam;
  setFavicon(emoji);

  app.innerHTML = `
    <div class="preview">
      <span>${emoji}</span>
      ${titleParam}
    </div>
  `;
} else {
  let selectedEmoji = "📁";

  app.innerHTML = `
    <h1>Create Divider</h1>
    <input id="titleInput" placeholder="Enter tab name..." autofocus />

    <div class="emoji-grid" id="emojiGrid"></div>

    <button id="createBtn">Create</button>

    <div class="preview" id="preview">
      <span>📁</span>
      Preview
    </div>
  `;

  const grid = document.getElementById("emojiGrid");
  const preview = document.getElementById("preview");
  const input = document.getElementById("titleInput");

  emojis.forEach(e => {
    const div = document.createElement("div");
    div.className = "emoji";
    div.textContent = e;

    if (e === selectedEmoji) div.classList.add("selected");

    div.onclick = () => {
      selectedEmoji = e;
      document.querySelectorAll(".emoji").forEach(el => el.classList.remove("selected"));
      div.classList.add("selected");
      updatePreview();
    };

    grid.appendChild(div);
  });

  function updatePreview() {
    preview.innerHTML = `
      <span>${selectedEmoji}</span>
      ${input.value || "Preview"}
    `;
  }

  input.addEventListener("input", updatePreview);

  document.getElementById("createBtn").onclick = () => {
    const title = input.value.trim();
    if (!title) return;

    const url = `?title=${encodeURIComponent(title)}&icon=${encodeURIComponent(selectedEmoji)}`;
    location.search = url;
  };
}
</script>

</body>
</html>
